[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "planwise"
version = "1.0.0"
description = "SQLite query-plan linter: spot full scans and temp B-trees before they hurt"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["sqlite", "sql", "performance", "query-plan"]
dependencies = []

[project.scripts]
planwise = "planwise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
